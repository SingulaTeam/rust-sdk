# cargo-deny: what may be depended on, and from where.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the build; an exception needs an entry here
# with the reason it does not apply to this crate.
ignore = [
    # RSA private-key timing (Marvin), in `rsa` via blind-rsa-signatures. The
    # client only blinds, unblinds and verifies — public-key operations; the
    # private key is the issuer's and never in this process.
    { id = "RUSTSEC-2023-0071", reason = "public-key operations only" },
    # ANSI injection in tracing-subscriber 0.2, pulled in by arkworks'
    # ark-relations for constraint tracing. This crate never installs a
    # tracing subscriber, so nothing reaches it.
    { id = "RUSTSEC-2025-0055", reason = "the subscriber is never installed" },
    # Unmaintained, not vulnerable, and without a maintained successor in the
    # arkworks and alloy releases this crate depends on.
    { id = "RUSTSEC-2024-0388", reason = "derivative: transitive via arkworks, unmaintained only" },
    { id = "RUSTSEC-2024-0436", reason = "paste: transitive via arkworks and alloy, unmaintained only" },
]

[licenses]
# Permissive licenses only: whatever depends on this crate must be free to
# remain under its own terms.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
