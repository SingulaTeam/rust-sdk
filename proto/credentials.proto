syntax = "proto3";

// The tunnel settings a node seals for its client, as node.proto in the
// Control Plane's repository defines them. Only these messages are copied;
// the field numbers must stay identical to the original.
package singula.node.v1;

// VlessCredentials is encrypted inside SessionCredentials.encrypted_credentials.
message VlessCredentials {
  string uuid = 1;                  // VLESS UUID
  string address = 2;               // Node address (IP or domain)
  int32 port = 3;                   // Node port (legacy, equals endpoint_port when sni_pool is set)
  string flow = 4;                  // e.g., "xtls-rprx-vision"

  // Reality settings
  string reality_public_key = 5;
  string reality_short_id = 6;      // legacy: == sni_pool[0].short_id
  string server_name = 7;           // legacy: == sni_pool[0].server_name
  string fingerprint = 8;           // TLS fingerprint (e.g., "chrome")

  // Server names to present, each with its Reality short id. Clients pick
  // one per connection. Empty on older nodes, which use the two legacy
  // fields above.
  repeated SNIVariant sni_pool = 9;
  uint32 rotation_period_sec   = 10; // 0 = rotate only on reconnect
  uint32 endpoint_port         = 11; // Reality inbound port for the chosen cover
  string preset_id             = 12; // the chosen cover
  // The chosen cover's xHTTP path. Every cover is served two ways on the same
  // port and behind the same REALITY: raw TCP with `flow`, or xHTTP at this
  // path with no flow. Empty on nodes that serve raw TCP only.
  string transport_path        = 13;

  // Every cover the node serves. The session works under any of them, so a
  // client whose cover is blocked can switch without a new session.
  repeated CoverOption covers = 14;
}

message SNIVariant {
  string server_name = 1;
  string short_id   = 2; // hex, 0..16 chars
}

message CoverOption {
  string preset_id = 1;
  repeated SNIVariant sni_pool = 2;
  string xhttp_path = 3; // this cover's xHTTP path; see transport_path
}
